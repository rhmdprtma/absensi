<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in Berdua ❤️</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#fff1f2;padding:16px;padding-bottom:40px}
.card{max-width:480px;margin:auto;background:white;border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
h1{text-align:center;margin:0;font-size:22px}
p.sub{text-align:center;color:#888;font-size:13px;margin-top:4px}
label{font-size:13px;font-weight:700;margin-top:14px;display:block}
input,select{width:100%;padding:12px;border:2px solid #ffe4e6;border-radius:14px;margin-top:6px;font-size:15px;outline:none;background:#fffafa}
button{width:100%;padding:14px;border:0;border-radius:16px;background:#f43f5e;color:white;font-size:16px;font-weight:800;margin-top:18px;cursor:pointer}
button:active{transform:scale(.98)}
.item{background:#fff7ed;border-radius:16px;padding:12px;margin-top:12px}
.badge{display:inline-block;background:#fecdd3;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>Check-in Berdua ❤️</h1>
<p class="sub">Buat lu & doi, biar keinget terus</p>

<label>Siapa yang check-in?</label>
<select id="nama"><option>Rahmad</option><option>Doi</option></select>

<label>Jenis Check-in</label>
<select id="jenis">
<option>📍 Lagi di mana</option>
<option>🍜 Lagi makan apa</option>
<option>💭 Lagi mikirin apa</option>
<option>❤️ Kangen</option>
<option>🌙 Sebelum tidur</option>
<option>☀️ Bangun tidur</option>
</select>

<label>Lagi ngapain?</label>
<input id="ngapain" placeholder="cth: Lagi di jalan pulang, macet parah...">

<label>Sama siapa?</label>
<input id="samaSiapa" placeholder="cth: Sendirian / sama temen">

<label>Lokasi</label>
<input id="lokasi" placeholder="cth: Bekasi, di kosan">

<button onclick="kirim()">Kirim Check-in 💌</button>
<p id="status" style="text-align:center;font-size:13px"></p>

<h3 style="margin-top:24px">Riwayat Kita 📖</h3>
<div id="list">Loading...</div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyNG2bID9FprUr2NL_UfoL1mfHzrTWcZbb6eqGHG8jQuvQQJ-PgCf39lEots0oSPQEt/exec";

async function kirim(){
  document.getElementById('status').innerText = "Lagi ngirim...";
  const form = new URLSearchParams();
  form.append('nama', document.getElementById('nama').value);
  form.append('jenis', document.getElementById('jenis').value);
  form.append('waktu', new Date().toLocaleString('id-ID'));
  form.append('ngapain', document.getElementById('ngapain').value);
  form.append('samaSiapa', document.getElementById('samaSiapa').value);
  form.append('lokasi', document.getElementById('lokasi').value);
  form.append('foto', "");
  await fetch(SHEET_URL, {method:'POST', mode:'no-cors', body: form});
  document.getElementById('status').innerText = "Udah kekirim! ❤️";
  document.getElementById('ngapain').value="";
  setTimeout(load, 1500);
}

function load(){
  const old = document.getElementById('jsonp');
  if(old) old.remove();
  const s = document.createElement('script');
  s.id = 'jsonp';
  s.src = SHEET_URL + "?callback=tampilData";
  document.body.appendChild(s);
}

function tampilData(rows){
  const list = document.getElementById('list');
  list.innerHTML = "";
  if(!rows || !rows.length){ list.innerHTML="Belum ada check-in, yuk yang pertama!"; return; }
  rows.reverse().forEach(r=>{
    list.innerHTML += `<div class="item"><span class="badge">${r[0]} • ${r[1]}</span><p style="font-size:12px;color:#888;margin:6px 0">${r[2]} • ${r[5] || ''}</p><p style="margin:4px 0">${r[3] || ''}</p><p style="font-size:13px;margin:4px 0">Sama: ${r[4] || ''}</p></div>`;
  });
}
load();
</script>
</body>
</html>
